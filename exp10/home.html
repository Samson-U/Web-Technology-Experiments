
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <h1>User Registration Form</h1>
        <p class="subtitle">Fill in your details to register</p>

        <form action="/server" method="POST">
            <label>Name</label>
            <input type="text" name="name" placeholder="Enter your name"
                   required>

            <label>Password</label>
            <input type="password" name="password" minlength="6"
                   placeholder="Minimum 6 characters" required>

            <label>Age</label>
            <input type="number" name="age" min="1" max="120"
                   placeholder="Enter your age" required>

            <label>Mobile Number</label>
            <input type="tel" name="mobile" pattern="[0-9]{10}"
                   placeholder="10-digit mobile number" required>

            <label>Email</label>
            <input type="email" name="email" placeholder="Enter your email"
                   required>

            <label>Gender</label>
            <div class="options">
                <label><input type="radio" name="gender" value="Male" required>
                    Male</label>
                <label><input type="radio" name="gender" value="Female">
                    Female</label>
            </div>

            <label>State</label>
            <select name="state" required>
                <option value="">Select State</option>
                <option>Kerala</option>
                <option>Tamil Nadu</option>
                <option>Karnataka</option>
                <option>Andhra Pradesh</option>
                <option>Telangana</option>
            </select>

            <label>Skills</label>
            <div class="options">
                <label><input type="checkbox" name="skills" value="JavaScript">
                    JavaScript</label>
                <label><input type="checkbox" name="skills" value="Python">
                    Python</label>
                <label><input type="checkbox" name="skills" value="C++">
                    C++</label>
                <label><input type="checkbox" name="skills" value="Java">
                    Java</label>
            </div>

            <button type="submit">Register Now</button>
        </form>
    </div>
</body>
</html>
