<!DOCTYPE html>
<html>
<head>
    <title>Comment Box</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2ff;
            margin: 0;
            padding: 40px;
        }
        .box {
            max-width: 500px;
            margin: auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px #ccd2e0;
        }
        h2 { color: #4338ca; }
        textarea {
            width: 100%;
            height: 90px;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            resize: vertical;
        }
        button {
            padding: 9px 15px;
            border: none;
            border-radius: 6px;
            background: #4f46e5;
            color: white;
            cursor: pointer;
        }
        li {
            background: #f5f7ff;
            padding: 10px;
            margin: 8px 0;
            border-radius: 6px;
            overflow-wrap: anywhere;
        }
        .remove { background: #ef4444; float: right; }
    </style>
</head>

<body ng-app="myApp" ng-controller="myCtrl">

    <div class="box">
        <h2>Comment Box</h2>
        <p>Share your thoughts below.</p>

        <textarea ng-model="msg"
                  placeholder="Write a comment..."></textarea>
        <br><br>

        <button ng-click="add()">Post Comment</button>

        <h3>Comments ({{comments.length}})</h3>

        <p ng-if="comments.length == 0">No comments yet.</p>

        <ul>
            <li ng-repeat="c in comments">
                {{c}}
                <button class="remove"
                        ng-click="remove($index)">X</button>
            </li>
        </ul>
    </div>

    <script>
        var app = angular.module("myApp", []);

        app.controller("myCtrl", function($scope) {
            $scope.comments = [];

            $scope.add = function() {
                if ($scope.msg && $scope.msg.trim()) {
                    $scope.comments.push($scope.msg);
                    $scope.msg = "";
                }
            };

            $scope.remove = function(i) {
                $scope.comments.splice(i, 1);
            };
        });
    </script>

</body>
</html>
